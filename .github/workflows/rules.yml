name: Site bases

# Базы сайтов (*.srs) для приложения: раз в день берём свежие официальные базы sing-box,
# проверяем и кладём в ветку «rules». Приложение скачивает оттуда только изменившиеся файлы
# (по rules.json), а при недоступности GitHub — с зеркала jsDelivr.
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-bases
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      SING_BOX: "1.13.21"
    steps:
      - name: Download fresh bases
        run: |
          set -euo pipefail
          mkdir -p out
          for f in geoip-ru.srs geosite-category-ru.srs geosite-category-ads-all.srs geosite-category-porn.srs geosite-category-betting-ru.srs; do
            case "$f" in geoip-*) repo=sing-geoip ;; *) repo=sing-geosite ;; esac
            curl -fsSL --retry 3 -o "out/$f" "https://raw.githubusercontent.com/SagerNet/$repo/rule-set/$f"
            # Файл .srs начинается с сигнатуры «SRS»
            [ "$(head -c 3 "out/$f")" = "SRS" ] || { echo "::error title=Базы::повреждён $f"; exit 1; }
          done
          ls -la out

      - name: HaGeZi Multi Normal
        run: |
          set -uo pipefail
          # 3.17.5: второй список рекламы и трекеров — HaGeZi Multi Normal (формат AdGuard).
          # sing-box переводит его в .srs. Не скачался или не собрался — просто нет файла,
          # приложение работает с основной базой.
          curl -fsSL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX}/sing-box-${SING_BOX}-linux-amd64.tar.gz" | tar xz
          SB=$(ls -d sing-box-*/)sing-box
          mkdir -p json
          if curl -fsSL --retry 3 -o hagezi.txt "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/multi.txt" &&
             [ "$(grep -c '^||' hagezi.txt)" -gt 10000 ] &&
             "$SB" rule-set convert --type adguard -o out/ads-hagezi.srs hagezi.txt &&
             [ "$(head -c 3 out/ads-hagezi.srs)" = "SRS" ]; then
            grep -c '^||' hagezi.txt > json/ads-hagezi.count
            echo "::notice title=HaGeZi::$(cat json/ads-hagezi.count) доменов"
          else
            rm -f out/ads-hagezi.srs
            echo "::warning title=HaGeZi::список не собран — остаётся основная база"
          fi

      - name: HaGeZi Threat Intelligence
        run: |
          set -uo pipefail
          # 3.17.9: мошенники, фишинг, вирусы (HaGeZi TIF, облегчённая версия) — по переключателю
          SB=$(ls -d sing-box-*/)sing-box
          ok=""
          for v in tif.mini tif.medium; do
            if curl -fsSL --retry 3 -o tif.txt "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/$v.txt" &&
               [ "$(grep -c '^||' tif.txt)" -gt 1000 ] &&
               "$SB" rule-set convert --type adguard -o out/threats-hagezi.srs tif.txt &&
               [ "$(head -c 3 out/threats-hagezi.srs)" = "SRS" ]; then ok=$v; break; fi
          done
          if [ -n "$ok" ]; then
            grep -c '^||' tif.txt > json/threats-hagezi.count
            echo "::notice title=HaGeZi TIF::$ok — $(cat json/threats-hagezi.count) доменов"
          else
            rm -f out/threats-hagezi.srs
            echo "::warning title=HaGeZi TIF::не собран"
          fi

      - name: Russia — only from inside
        run: |
          set -uo pipefail
          # 3.17.6: сайты, которые работают только из России (Госуслуги, банки, магазины,
          # в том числе не на .ru) — от runetfreedom. В «Умном» режиме идут напрямую.
          ok=""
          for u in \
            "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/sing-box/rule-set-geosite/geosite-ru-available-only-inside.srs" \
            "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/sing-box/geosite-ru-available-only-inside.srs"; do
            if curl -fsSL --retry 3 -o out/ru-inside.srs "$u" && [ "$(head -c 3 out/ru-inside.srs)" = "SRS" ]; then ok="$u"; break; fi
          done
          if [ -n "$ok" ]; then
            echo "::notice title=Россия::список «только из России» скачан ($ok)"
          else
            rm -f out/ru-inside.srs
            echo "::warning title=Россия::список «только из России» не скачан — остаётся основная база"
          fi

      - name: Count sites
        run: |
          set -uo pipefail
          # Сколько доменов и сетей в каждой базе — приложение показывает это в «Маршрутизации»
          curl -fsSL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX}/sing-box-${SING_BOX}-linux-amd64.tar.gz" | tar xz
          SB=$(ls -d sing-box-*/)sing-box
          mkdir -p json
          for f in out/*.srs; do
            n=$(basename "$f" .srs)
            "$SB" rule-set decompile "$f" -o "json/$n.json" 2>/dev/null || echo "::warning::не удалось разобрать $n"
          done
          ls json || true

      - name: Manifest
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import hashlib, json, os, time
          files = {}
          for name in sorted(os.listdir("out")):
              if not name.endswith(".srs"):
                  continue
              data = open(f"out/{name}", "rb").read()
              entry = {"sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
              j = f"json/{name[:-4]}.json"
              cnt = f"json/{name[:-4]}.count"
              if os.path.exists(cnt):
                  entry["count"] = int(open(cnt).read().strip() or 0)
              elif os.path.exists(j):
                  count = 0
                  for rule in json.load(open(j)).get("rules", []):
                      for key in ("domain", "domain_suffix", "domain_keyword", "domain_regex", "ip_cidr"):
                          v = rule.get(key)
                          count += len(v) if isinstance(v, list) else (1 if v else 0)
                  entry["count"] = count
              files[name] = entry
          json.dump({"updated": int(time.time()), "files": files}, open("out/rules.json", "w"), ensure_ascii=False, indent=1)
          print(open("out/rules.json").read())
          EOF

      - name: Publish to branch «rules» if changed
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OLD=$(curl -fsSL "https://raw.githubusercontent.com/$REPO/rules/rules.json" 2>/dev/null || echo '{}')
          same=$(python3 -c '
          import json, sys
          old = json.loads(sys.argv[1] or "{}").get("files", {})
          new = json.load(open("out/rules.json"))["files"]
          print("yes" if {k: v["sha256"] for k, v in old.items()} == {k: v["sha256"] for k, v in new.items()} else "no")
          ' "$OLD")
          if [ "$same" = "yes" ]; then
            echo "::notice title=Базы::без изменений"
            exit 0
          fi
          cd out
          cat > README.md <<'EOF'
          # Базы сайтов APEX CLIENT
          Обновляются автоматически раз в день (официальные базы sing-box). Не редактируйте вручную.
          EOF
          git init -q -b rules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Базы сайтов $(date -u +%F)"
          # Одна запись в истории: ветка не растёт от ежедневных обновлений
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" rules
          echo "::notice title=Базы::опубликованы"
          # jsDelivr кэширует ветку — просим обновить зеркало
          for f in *.srs rules.json; do curl -fsS "https://purge.jsdelivr.net/gh/${REPO}@rules/$f" > /dev/null || true; done
