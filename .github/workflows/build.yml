name: Build APEX VPN

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Правка README, картинок и скриптов VPS не пересобирает приложение
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
  # Раз в неделю «трогаем» ключ подписи в кэше, чтобы GitHub его не удалил
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

# Новый пуш отменяет незаконченную сборку: иначе старая версия, собравшаяся позже,
# становилась «последней» вместо новой (так 3.1.0 перебила 3.1.1)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Keep build signing key alive
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: apex-debug-keystore-v1

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.apk.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      # Свежие базы сайтов внутри APK: из ветки «rules» (обновляется раз в день),
      # если её нет — официальные базы sing-box. Не скачалось — остаются базы из репозитория.
      - name: Fresh site bases
        run: |
          for f in geoip-ru.srs geosite-category-ru.srs geosite-category-ads-all.srs geosite-category-porn.srs geosite-category-betting-ru.srs; do
            case "$f" in geoip-*) repo=sing-geoip ;; *) repo=sing-geosite ;; esac
            if curl -fsSL --retry 2 -o "/tmp/$f" "https://raw.githubusercontent.com/${{ github.repository }}/rules/$f" ||
               curl -fsSL --retry 2 -o "/tmp/$f" "https://raw.githubusercontent.com/SagerNet/$repo/rule-set/$f"; then
              [ "$(head -c 3 "/tmp/$f")" = "SRS" ] && cp "/tmp/$f" "app/src/main/assets/rules/$f" || echo "::warning title=Базы::$f повреждён — оставлен старый"
            else
              echo "::warning title=Базы::$f не скачался — оставлен старый"
            fi
          done
          ls -la app/src/main/assets/rules

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: false

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Xray core
        run: XRAY_HOST=1 ./core/fetch-xray.sh

      - name: Cache core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: core-${{ hashFiles('core/**') }}

      - name: Build core (sing-box + apexcore)
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: ./core/build-core.sh

      - name: Check core
        run: |
          ls -la app/libs/ app/src/main/jniLibs/*/ || true
          test -s app/libs/libbox.aar || { echo "::error title=Ядро::app/libs/libbox.aar не найден после сборки ядра"; exit 1; }

      # Без своего ключа сборки подписываются ключом отладки. Он хранится в кэше Actions,
      # чтобы версии ставились поверх друг друга (раньше ключ был новый в каждой сборке).
      - name: Restore build signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: apex-debug-keystore-v1

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apex.jks"
            echo "APEX_KEYSTORE_PATH=$RUNNER_TEMP/apex.jks" >> "$GITHUB_ENV"
          else
            if [ ! -s ~/.android/debug.keystore ]; then
              mkdir -p ~/.android
              keytool -genkeypair -keystore ~/.android/debug.keystore -storetype PKCS12 -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            fi
            echo "::warning title=Подпись::Нет секрета APEX_KEYSTORE_BASE64 — APK подписан ключом сборки. Добавьте ключ с сервера (docs/GUIDE.md, шаг 3), чтобы версии с GitHub и с сервера ставились друг поверх друга."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log; then
            # Ошибки сборки — в аннотации, чтобы их было видно без полного лога
            grep -E "^e: |error:|Error:|What went wrong|Could not|^> [^T]" gradle.log | sed 's/%/%25/g' | head -200 > errors.txt || true
            # Ошибки lint — из отчётов
            for f in app/build/intermediates/lint_intermediate_text_report/*/*/lint-results*.txt wear/build/intermediates/lint_intermediate_text_report/*/*/lint-results*.txt app/build/reports/lint-results*.txt wear/build/reports/lint-results*.txt; do
              [ -f "$f" ] && grep -E "Error:" -A3 "$f" | sed 's/%/%25/g' | head -60 >> errors.txt
            done
            split -l 20 errors.txt err_ || true
            for f in err_*; do
              [ -s "$f" ] && echo "::error title=Gradle::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"
            done
            exit 1
          fi

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          APK="dist/apex-vpn-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # 11. Приложение для часов Wear OS
          WEAR="dist/apex-watch-${VERSION_NAME}.apk"
          if [ -f wear/build/outputs/apk/release/wear-release.apk ]; then
            cp wear/build/outputs/apk/release/wear-release.apk "$WEAR"
            echo "::notice title=Wear OS::$(du -h "$WEAR" | cut -f1)"
          fi
          # Проверка: APK целый и подписан
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" > signer.txt; head -3 signer.txt
          # Защита от подделок: релиз должен быть подписан ключом автора — тем же, что записан
          # в Integrity.kt. Иначе приложение назвало бы свою же сборку «неофициальной копией».
          GOT=$(grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' signer.txt | head -1 | tr 'a-f' 'A-F')
          WANT=$(grep -oP 'OFFICIAL_CERT = "\K[0-9A-F]+' app/src/main/java/com/apexvpn/client/data/Integrity.kt)
          if [ "$GOT" != "$WANT" ]; then
            if [ "${{ github.repository }}" = "Dubstep2004/apex-vpn" ]; then
              echo "::error title=Подпись::APK подписан не официальным ключом ($GOT). Проверьте секреты APEX_KEYSTORE_BASE64 и APEX_KEYSTORE_PASSWORD — релиз не выпущен."
              exit 1
            fi
            echo "::warning title=Подпись::Сборка подписана не ключом автора — приложение покажет «Неофициальная копия»."
          else
            echo "::notice title=Подпись::✓ Официальный ключ"
          fi
          LIBS=$(unzip -l "$APK" | grep -oE "lib/[^ ]+\.so" | tr '\n' ' ')
          echo "::notice title=APK::$(du -h "$APK" | cut -f1) — $LIBS"
          echo "$LIBS" | grep -q "arm64-v8a/libxray.so" || { echo "::error title=APK::в APK нет ядра Xray"; exit 1; }
          # Что нового — из data/Changelog.kt (первая запись) с метками: 🟢 Новое, 🟣 Улучшено/Изменено, 🔵 Исправлено, 🔴 Удалено
          python3 scripts/changelog.py notes "$VERSION_NAME" > dist/changelog.txt
          cat dist/changelog.txt
          # Описание релиза: что нового + какой файл куда ставить
          {
            cat dist/changelog.txt
            echo
            echo "---"
            echo "📱 **apex-vpn-${VERSION_NAME}.apk** — для телефона"
            echo "⌚ **apex-watch-${VERSION_NAME}.apk** — только для часов Wear OS. На телефон не устанавливайте."
          } > dist/release.md
          # Описание версии для команды «apex publish» на сервере
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" --rawfile notes dist/changelog.txt \
            '{versionCode:$code, versionName:$name, changelog:$notes}' > "dist/apex-vpn-${VERSION_NAME}.json"
          {
            echo "name=$VERSION_NAME"
            echo "code=$VERSION_CODE"
            echo "apk=$APK"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apex-vpn-${{ steps.apk.outputs.name }}
          path: dist/*.apk

      # Прямая ссылка на .apk (не zip) — на странице Releases
      - name: GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.name }}
          name: APEX VPN ${{ steps.apk.outputs.name }}
          body_path: dist/release.md
          files: |
            ${{ steps.apk.outputs.apk }}
            dist/apex-vpn-${{ steps.apk.outputs.name }}.json
            dist/apex-watch-${{ steps.apk.outputs.name }}.apk
          make_latest: true

  # APEX VPN для Windows: тот же движок apexcore (apexcli.exe) + официальные sing-box и Xray.
  # Файлы добавляются в тот же релиз v<версия Android>. Сбой здесь не мешает Android-релизу.
  windows:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SING_BOX_VERSION: "1.13.21"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: false

      - name: apexcli.exe (общий движок apexcore)
        run: |
          set -euo pipefail
          T=$(cygpath -u "$RUNNER_TEMP"); W=$(pwd)
          git clone --quiet --depth 1 --branch "v$SING_BOX_VERSION" https://github.com/SagerNet/sing-box "$T/sb"
          cp -r core/apexcore "$T/sb/experimental/apexcore"
          rm -f "$T/sb/experimental/apexcore/naive_test.go"
          mkdir -p "$T/sb/cmd/apexcli" windows/resources/windows/rules
          cp windows/core/main.go "$T/sb/cmd/apexcli/"
          cd "$T/sb"
          TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags "$TAGS" -ldflags "-checklinkname=0 -s -w" \
            -o "$(cygpath -w "$W/windows/resources/windows/apexcli.exe")" ./cmd/apexcli
          echo '{"cmd":"version"}' | "$W/windows/resources/windows/apexcli.exe"

      - name: Ядра sing-box и Xray для Windows, базы сайтов
        run: |
          set -euo pipefail
          T=$(cygpath -u "$RUNNER_TEMP")
          R=windows/resources/windows
          curl -fsSL --retry 3 -o "$T/sb.zip" "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-windows-amd64.zip"
          unzip -q -o "$T/sb.zip" -d "$T/sbz"
          cp "$T"/sbz/*/sing-box.exe "$R/sing-box.exe"
          XV=$(cat core/xray-version)
          curl -fsSL --retry 3 -o "$T/xr.zip" "https://github.com/XTLS/Xray-core/releases/download/$XV/Xray-windows-64.zip"
          unzip -q -o "$T/xr.zip" xray.exe -d "$R"
          for f in geoip-ru.srs geosite-category-ru.srs geosite-category-ads-all.srs geosite-category-porn.srs geosite-category-betting-ru.srs; do
            curl -fsSL --retry 2 -o "$R/rules/$f" "https://raw.githubusercontent.com/${{ github.repository }}/rules/$f" || cp "app/src/main/assets/rules/$f" "$R/rules/$f"
          done
          ls -la "$R" "$R/rules"
          "$R/sing-box.exe" version | head -2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: WiX (для установщика .exe)
        continue-on-error: true
        shell: pwsh
        run: choco install wixtoolset --version 3.14.1 -y --no-progress

      - name: Сборка APEX VPN для Windows
        run: |
          set -o pipefail
          if ! gradle -p windows --no-daemon createDistributable 2>&1 | tee win.log; then
            grep -E "^e: |error:|What went wrong" win.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=Windows::/'
            exit 1
          fi
          gradle -p windows --no-daemon packageExe 2>&1 | tail -20 || echo "::warning title=Windows::установщик .exe не собрался — будет только .zip"

      - name: Файлы для релиза
        id: win
        run: |
          set -euo pipefail
          V="${{ needs.build.outputs.version }}"
          WV=$(gradle -p windows -q --no-daemon printVersion | tail -1)
          mkdir -p dist
          APPDIR="windows/build/compose/binaries/main/app/APEX VPN"
          test -d "$APPDIR"
          W=$(pwd)
          (cd "windows/build/compose/binaries/main/app" && 7z a -tzip "$(cygpath -w "$W/dist/apex-vpn-$V-windows.zip")" "APEX VPN" > /dev/null)
          EXE=$(ls windows/build/compose/binaries/main/exe/*.exe 2>/dev/null | head -1 || true)
          [ -n "$EXE" ] && cp "$EXE" "dist/apex-vpn-$V-windows.exe"
          ls -la dist
          echo "::notice title=Windows $WV::$(ls dist | tr '\n' ' ')"
          {
            echo
            echo "💻 **Windows $WV** — apex-vpn-$V-windows.exe (установщик) или apex-vpn-$V-windows.zip (без установки)"
          } > dist/win.md
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Добавить в релиз
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.win.outputs.version }}
          body_path: dist/win.md
          append_body: true
          files: |
            dist/apex-vpn-*-windows.exe
            dist/apex-vpn-*-windows.zip
