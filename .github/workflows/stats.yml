name: Download stats

# 211. Раз в день и после выпуска версии обновляет docs/stats.svg — картинку со скачиваниями в README,
# и (пульт 2.15) записывает итог дня в docs/stats/downloads.json для графика «По дням»
on:
  schedule:
    - cron: "41 2 * * *"
  release:
    types: [published]
  workflow_dispatch:
  # Пульт 2.24: кнопка «Обновить» в «Пользователях» — пульт меняет этот файл
  push:
    branches: [main]
    paths: ["docs/stats/users-refresh.json"]

permissions:
  contents: write

jobs:
  stats:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # для «без сбоев N дней» нужна история app.json
      - name: Build stats image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate --slurp > /tmp/releases.json
          python3 scripts/download-stats.py < /tmp/releases.json > docs/stats.svg
      - name: Days without outages (site)
        run: python3 scripts/uptime.py
      - name: Daily snapshot for the pult chart
        # Пульт 2.15: «Скачивания по дням» — итог раз в сутки в docs/stats/downloads.json (до 400 дней)
        run: |
          python3 - <<'PY'
          import json, os, datetime
          pages = json.load(open('/tmp/releases.json'))
          rel = [r for p in pages for r in p]
          cnt = lambda pre: sum(a['download_count'] for r in rel for a in r['assets'] if a['name'].startswith(pre) and a['name'].endswith('.apk'))
          phone, watch = cnt('apex-client-') + cnt('apex-vpn-'), cnt('apex-watch-')
          P = 'docs/stats/downloads.json'; os.makedirs('docs/stats', exist_ok=True)
          d = json.load(open(P)) if os.path.exists(P) else {'days': []}
          today = datetime.datetime.utcnow().strftime('%Y-%m-%d')
          d['days'] = [x for x in d['days'] if x['d'] != today] + [{'d': today, 'phone': phone, 'watch': watch}]
          d['days'] = d['days'][-400:]
          open(P, 'w').write(json.dumps(d, indent=1) + '\n')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats.svg docs/stats/downloads.json docs/stats/uptime.json
          git diff --cached --quiet || { git commit -m "Статистика скачиваний"; git push; }

  # Пульт 2.24: «Пользователи» — сколько человек в приложении, по данным панели Remnawave (tools/users-stats).
  # Только числа, зашифрованные ключом STATS_KEY; адрес панели и токен — в секретах.
  users:
    runs-on: ubuntu-latest
    concurrency:
      group: users-stats
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Count users from the panel
        env:
          REMNA_URL: ${{ secrets.REMNA_URL }}
          REMNA_TOKEN: ${{ secrets.REMNA_TOKEN }}
          REMNA_COOKIE: ${{ secrets.REMNA_COOKIE }}
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: |
          [ -n "$REMNA_URL" ] && [ -n "$REMNA_TOKEN" ] && [ -n "$STATS_KEY" ] || { echo "Нет секретов REMNA_URL / REMNA_TOKEN / STATS_KEY — пропускаю"; exit 0; }
          python3 -m pip install --quiet --break-system-packages cryptography || python3 -m pip install --quiet cryptography
          python3 tools/users-stats/users_stats.py
      - name: Commit if changed
        run: |
          [ -f docs/stats/users.enc.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats/users.enc.json
          git diff --cached --quiet && exit 0
          git commit -m "Пользователи: статистика из панели (зашифровано)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
