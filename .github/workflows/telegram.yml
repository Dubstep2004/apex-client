name: Telegram-канал

# Робот сам пишет в канал: новая версия, техработы, задания из пульта, итоги опросов, дайджест, праздники (scripts/tg_channel.py).
# Нужны секреты репозитория TG_BOT_TOKEN и TG_CHAT — без них ничего не делает.
# GitHub запускает «каждые 10 минут» очень редко (бывает раз в несколько часов), поэтому после каждого запуска
# работает «будильник»: ждёт ровно до следующего дела (отложенный пост, конец техработ, итоги опроса, отложенное
# сохранение пульта, дайджест, праздник) и сам запускает нужного робота. Расписание ниже — только запасное.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows: ["Build APEX CLIENT"]
    types: [completed]
  push:
    branches: [main]
    paths: ["docs/config/app.json", "docs/tg/outbox.json", "docs/tg/settings.json", "docs/config/pending.json"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Pillow for the pictures
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true
      - name: Post to channel
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_CHAT_EN: ${{ secrets.TG_CHAT_EN }}
          TG_OWNER: ${{ secrets.TG_OWNER }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BOT_WORKER_URL: ${{ secrets.BOT_WORKER_URL }}
          BOT_WORKER_KEY: ${{ secrets.BOT_WORKER_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/tg_channel.py
      - name: Save state
        run: |
          [ -f docs/stats/tg-state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats/tg-state.json docs/stats/tg-members.svg 2>/dev/null || git add docs/stats/tg-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Telegram-канал: состояние робота"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done

  # Будильник: новый запуск отменяет старый (там уже устаревшее расписание), поэтому ждёт всегда один.
  timer:
    needs: post
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: telegram-timer
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait for the next task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(python3 scripts/tg_channel.py --next); echo "Следующее дело: $N"
          [ "$N" = "none" ] && exit 0
          S=${N%% *}; BOTS=${N#* }
          if [ "$S" -gt 20400 ]; then S=20400; BOTS=telegram; fi   # дольше 5 ч 40 мин ждать нельзя — перезапустимся
          sleep "$S"
          for b in ${BOTS//,/ }; do gh workflow run "$b.yml" -R "$GITHUB_REPOSITORY" --ref main; done
