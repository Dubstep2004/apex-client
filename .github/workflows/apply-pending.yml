name: Отложенное сохранение пульта

# Пульт 2.15: «⏰ Сохранить позже» кладёт изменения в docs/config/pending.json.
# Запускает его «будильник» из telegram.yml ровно в назначенное время (расписание GitHub ниже — запасное, оно редкое).
# Переносит изменения в docs/config/app.json, затем запускает робота Telegram (техработы в канал).
# Если app.json успели поменять после планирования — не затирает, а помечает конфликт (пульт покажет).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-pending
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply if due
        run: |
          [ -f docs/config/pending.json ] || { echo "Нечего применять"; exit 0; }
          python3 - <<'PY'
          import json, os, time, subprocess
          P, A = 'docs/config/pending.json', 'docs/config/app.json'
          d = json.load(open(P, encoding='utf-8'))
          if d.get('error') or not d.get('at') or time.time() * 1000 < d['at']:
              print('Ещё не время или уже помечено'); raise SystemExit
          cur = json.load(open(A, encoding='utf-8')) if os.path.exists(A) else None
          if d.get('base') is not None and cur != d['base']:
              d['error'] = 'conflict'
              open(P, 'w', encoding='utf-8').write(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
              msg = 'Отложенное сохранение не применено: настройки поменяли после планирования'
          else:
              if not isinstance(d.get('app'), dict): raise SystemExit('В pending.json нет настроек')
              open(A, 'w', encoding='utf-8').write(json.dumps(d['app'], ensure_ascii=False, indent=2) + '\n')
              os.remove(P)
              msg = 'Пульт: отложенное сохранение — ' + (d.get('what') or 'настройки')
          open(os.environ['GITHUB_ENV'], 'a').write('MSG=' + msg + '\n')
          PY
      - name: Commit
        run: |
          [ -n "$MSG" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/config
          git diff --cached --quiet || { git commit -m "$MSG"; git push; }
      - name: Telegram robot (maintenance posts for the new settings)
        if: ${{ env.MSG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run telegram.yml -R "$GITHUB_REPOSITORY" --ref main
